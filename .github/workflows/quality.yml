name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # Fails if anything from the original game is tracked: local-only paths,
  # byte-identical original files, or the original's names and text (matched
  # by hash; see tools/check_independent.py). Needs only Python.
  independent:
    name: No original content
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for original game content
        run: python3 tools/check_independent.py

  # macOS, the platform the DMG ships for; the shell's audio and window
  # crates need no extra system packages there.
  rust:
    name: Format and tests
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace
